name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_PROJECT: src/GraphSketcher.App/GraphSketcher.App.csproj
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"
  NUGET_XMLDOC_MODE: skip
  SOLUTION: GraphSketcher.Linux.sln

jobs:
  metadata:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Parse semantic version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Release tags must use semantic versioning." >&2
            exit 2
          fi
          echo "version=${RELEASE_TAG#v}" >>"$GITHUB_OUTPUT"

  verify:
    name: Restore, build, and test
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Install the repository .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore "$SOLUTION"

      - name: Build
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: >-
          dotnet build "$SOLUTION"
          --configuration Release
          --no-restore
          -p:Version="$RELEASE_VERSION"

      - name: Test
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: >-
          dotnet test "$SOLUTION"
          --configuration Release
          --no-build
          -p:Version="$RELEASE_VERSION"
          --logger "trx;LogFileName=tests.trx"
          --results-directory TestResults

  package:
    name: Package ${{ matrix.runtime }}
    needs:
      - metadata
      - verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - linux-x64
          - linux-arm64

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Install the repository .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install packaging and smoke-test libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libdbus-1-3 \
            libfontconfig1 \
            libfreetype6 \
            libgl1 \
            libice6 \
            libsm6 \
            libx11-6 \
            libx11-xcb1 \
            libxcb1 \
            libxext6 \
            libxrender1 \
            xvfb \
            zlib1g

      - name: Restore for ${{ matrix.runtime }}
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: dotnet restore "$APP_PROJECT" --runtime "$RUNTIME"

      - name: Publish self-contained application
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RUNTIME: ${{ matrix.runtime }}
        run: |
          dotnet publish "$APP_PROJECT" \
            --configuration Release \
            --runtime "$RUNTIME" \
            --self-contained true \
            --no-restore \
            --output "artifacts/publish-$RUNTIME" \
            -p:Version="$RELEASE_VERSION" \
            -p:PublishSingleFile=true \
            -p:DebugSymbols=false \
            -p:DebugType=None
          test -x "artifacts/publish-$RUNTIME/GraphSketcher"

      - name: Smoke-test x64 packaged executable
        if: matrix.runtime == 'linux-x64'
        run: >-
          xvfb-run --auto-servernum
          timeout 30
          artifacts/publish-linux-x64/GraphSketcher
          --smoke-test

      - name: Download and verify appimagetool
        if: matrix.runtime == 'linux-x64'
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/appimagetool-x86_64.AppImage" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $RUNNER_TEMP/appimagetool-x86_64.AppImage" \
            | sha256sum --check -
          chmod +x "$RUNNER_TEMP/appimagetool-x86_64.AppImage"

      - name: Build Linux packages
        env:
          APPIMAGETOOL_PATH: ${{ matrix.runtime == 'linux-x64' && format('{0}/appimagetool-x86_64.AppImage', runner.temp) || '' }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RUNTIME: ${{ matrix.runtime }}
        run: |
          packaging/build-linux-packages.sh \
            "$RUNTIME" \
            "$RELEASE_VERSION" \
            "artifacts/publish-$RUNTIME" \
            "artifacts/packages"

      - name: Upload Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.runtime }}
          path: |
            artifacts/packages/*.tar.gz
            artifacts/packages/*.deb
            artifacts/packages/*.AppImage
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Attest and publish release
    needs:
      - metadata
      - package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download release packages
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: release-assets
        run: |
          mapfile -t assets < <(
            find . -maxdepth 1 -type f \
              \( -name '*.tar.gz' -o -name '*.deb' -o -name '*.AppImage' \) \
              -printf '%f\n' \
              | sort
          )
          test "${#assets[@]}" -eq 5
          sha256sum "${assets[@]}" > SHA256SUMS

      - name: Attest release packages
        id: attest-packages
        continue-on-error: true
        uses: actions/attest@v4
        with:
          subject-checksums: release-assets/SHA256SUMS
          create-storage-record: false

      - name: Attest checksum manifest
        id: attest-checksums
        continue-on-error: true
        uses: actions/attest@v4
        with:
          subject-path: release-assets/SHA256SUMS
          create-storage-record: false

      - name: Note unavailable attestations
        if: steps.attest-packages.outcome == 'failure' || steps.attest-checksums.outcome == 'failure'
        run: |
          {
            echo "### Artifact attestation"
            echo
            echo "GitHub attestation was unavailable. Verify downloads with SHA256SUMS."
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload complete release asset set
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ github.ref_name }}
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -print | sort)
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          elif [[ "$RELEASE_TAG" == *-* ]]; then
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --prerelease \
              --title "GraphSketcher for Linux $RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "GraphSketcher for Linux $RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY"
          fi
