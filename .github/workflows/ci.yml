name: Linux CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_PROJECT: src/GraphSketcher.App/GraphSketcher.App.csproj
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"
  NUGET_XMLDOC_MODE: skip
  SOLUTION: GraphSketcher.Linux.sln

jobs:
  verify:
    name: Restore, build, test, and validate metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install the repository .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Install Linux validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            appstream \
            desktop-file-utils \
            libdbus-1-3 \
            libfontconfig1 \
            libfreetype6 \
            libgl1 \
            libice6 \
            libsm6 \
            libx11-6 \
            libx11-xcb1 \
            libxcb1 \
            libxext6 \
            libxrender1 \
            xvfb \
            zlib1g

      - name: Restore
        run: dotnet restore "$SOLUTION" --locked-mode

      - name: Build
        run: dotnet build "$SOLUTION" --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test "$SOLUTION"
          --configuration Release
          --no-build
          --logger "trx;LogFileName=tests.trx"
          --results-directory TestResults

      - name: Validate Linux integration files
        run: |
          bash -n packaging/build-linux-packages.sh packaging/linux/AppRun
          desktop-file-validate \
            packaging/linux/io.github.jacoba1100254352.GraphSketcher.desktop
          appstreamcli validate --no-net \
            packaging/linux/io.github.jacoba1100254352.GraphSketcher.metainfo.xml

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore
          retention-days: 14

  package:
    name: Package ${{ matrix.runtime }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - linux-x64
          - linux-arm64

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install the repository .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Install packaging and smoke-test libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libdbus-1-3 \
            libfontconfig1 \
            libfreetype6 \
            libgl1 \
            libice6 \
            libsm6 \
            libx11-6 \
            libx11-xcb1 \
            libxcb1 \
            libxext6 \
            libxrender1 \
            xvfb \
            zlib1g

      - name: Restore locked dependencies
        run: dotnet restore "$SOLUTION" --locked-mode

      - name: Publish self-contained application
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: |
          dotnet publish "$APP_PROJECT" \
            --configuration Release \
            --runtime "$RUNTIME" \
            --self-contained true \
            --no-restore \
            --output "artifacts/publish-$RUNTIME" \
            -p:PublishSingleFile=true \
            -p:DebugSymbols=false \
            -p:DebugType=None
          test -x "artifacts/publish-$RUNTIME/GraphSketcher"

      - name: Smoke-test x64 packaged executable
        if: matrix.runtime == 'linux-x64'
        run: >-
          xvfb-run --auto-servernum
          timeout 30
          artifacts/publish-linux-x64/GraphSketcher
          --smoke-test

      - name: Download and verify appimagetool
        if: matrix.runtime == 'linux-x64'
        run: |
          curl --fail --location --silent --show-error \
            --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/appimagetool-x86_64.AppImage" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $RUNNER_TEMP/appimagetool-x86_64.AppImage" \
            | sha256sum --check -
          chmod +x "$RUNNER_TEMP/appimagetool-x86_64.AppImage"

      - name: Build Linux packages
        env:
          APPIMAGETOOL_PATH: ${{ matrix.runtime == 'linux-x64' && format('{0}/appimagetool-x86_64.AppImage', runner.temp) || '' }}
          RUNTIME: ${{ matrix.runtime }}
        run: |
          packaging/build-linux-packages.sh \
            "$RUNTIME" \
            "0.1.0-preview.1" \
            "artifacts/publish-$RUNTIME" \
            "artifacts/packages"
          dpkg-deb --info artifacts/packages/*.deb
          dpkg-deb --contents artifacts/packages/*.deb | grep -F "usr/bin/graphsketcher"

      - name: Upload Linux packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packages-${{ matrix.runtime }}
          path: |
            artifacts/packages/*.tar.gz
            artifacts/packages/*.deb
            artifacts/packages/*.AppImage
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  checksums:
    name: Generate checksums
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: packages-*
          path: artifacts
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: artifacts
        run: |
          mapfile -t packages < <(
            find . -maxdepth 1 -type f \
              \( -name '*.tar.gz' -o -name '*.deb' -o -name '*.AppImage' \) \
              -printf '%f\n' \
              | sort
          )
          test "${#packages[@]}" -eq 5
          sha256sum "${packages[@]}" > SHA256SUMS

      - name: Upload complete package set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-packages
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
