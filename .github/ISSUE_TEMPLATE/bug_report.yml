name: Bug report
description: Report reproducible incorrect behavior or a crash in GraphSketcher for Linux.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve GraphSketcher. Remove private or sensitive data from graph files and logs before attaching them.

  - type: input
    id: version
    attributes:
      label: GraphSketcher version
      description: Enter the release version shown in the app, or the commit hash for a source build.
      placeholder: v0.1.0
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Linux distribution and desktop
      description: Include the edition and build number from Settings > System > About.
      placeholder: Ubuntu 24.04 with GNOME 46; Fedora 43 with KDE Plasma
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Computer architecture
      options:
        - x64
        - ARM64
        - Unknown
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the smallest reliable sequence that triggers the problem.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exact error text if one appeared.
    validations:
      required: true

  - type: textarea
    id: sample
    attributes:
      label: Sample file or data
      description: Attach a minimal `.graphsketch`, `.ograph`, CSV, or TSV file if it is safe to share.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, logs, display scaling, input-device details, or anything else that may help.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed private or sensitive information from attachments.
          required: true
